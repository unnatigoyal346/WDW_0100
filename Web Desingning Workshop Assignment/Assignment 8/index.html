<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 8 - Hyperlinks and Images</title>
</head>
<body>
  <h1>Hyperlinks and Images</h1>

  <h2>Internal Link</h2>
  <p><a href="#my-image">Go to the image section</a></p>

  <h2>External Link</h2>
  <p>
    <a href="https://www.w3.org/" target="_blank" rel="noopener noreferrer">
      Visit the W3C website
    </a>
  </p>

  <h2>Email Link</h2>
  <p><a href="mailto:student@example.com">Send me an email</a></p>

  <h2 id="my-image">Image with a Link</h2>
  <p>
    <a href="https://www.w3.org/" target="_blank" rel="noopener noreferrer">
        <img
        src="https://www.w3.org/assets/logos/w3c/w3c-no-bars.svg"
        alt="W3C logo; select the image to visit the W3C website"
        width="160">
    </a>
  </p>
      
</body>
</html>
