<!DOCTYPE html>
<html lang="en">

<body>
  <h1>Student Marks</h1>

  <table border="1">

    <thead>
      <tr>

        <th scope="col">Subject</th>
        <th scope="col">Marks</th>
      </tr>
    </thead>

    
</body>
