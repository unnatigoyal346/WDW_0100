<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 12: Table with Header, Caption and Footer</title>
</head>
<body>
  <h1>Student Marks</h1>

  <table border="1">
    <caption>Marks Obtained by Students</caption>

    <thead>
      <tr>
        <th scope="col">Student Name</th>
        <th scope="col">Subject</th>
        <th scope="col">Marks</th>
      </tr>
    </thead>

    <tbody>
      <tr>
        <td>Aarav</td>
        <td>HTML</td>
        <td>85</td>
      </tr>
      <tr>
        <td>Maya</td>
        <td>HTML</td>
        <td>92</td>
      </tr>
      <tr>
        <td>Rohan</td>
        <td>HTML</td>
        <td>78</td>
      </tr>
    </tbody>

  <tfoot>
      <tr>
        <th scope="row" colspan="2">Average</th>
        <td>85</td>
      </tr>
    </tfoot>
    </table>
</body>
</html>
