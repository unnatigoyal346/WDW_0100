<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 9 - Quotation and Citation Elements</title>
</head>
<body>
  <h1>Quotation and Citation Elements</h1>

  <h2>Short quotation</h2>
  <p>Our class motto is <q>Practice makes progress.</q></p>

  <h2>Long quotation</h2>
  <blockquote cite="https://www.w3.org/">
    <p>The web is for everyone.</p>
  </blockquote>

<h2>Citation</h2>
  <p>We are learning from <cite>Web Designing Workshop</cite>.</p>

  <h2>Abbreviation</h2>
  <p>
    <abbr title="World Wide Web Consortium">W3C</abbr>
    develops web standards. Hovering “W3C” to see its full form.
  </p>

</body>
</html>
