<!DOCTYPE html>
<html lang="en">
<head>

<body>
  <h1>Course Feedback Form</h1>

  <form>

      <label for="course">Choose a course:</label>

        <option value="css">CSS</option>
        <option value="javascript">JavaScript</option>
      </select>
    </p>
  </form>
</body>
