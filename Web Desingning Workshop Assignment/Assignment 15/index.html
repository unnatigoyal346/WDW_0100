<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 15: Form Inputs and Fieldset</title>
</head>
<body>
  <h1>Student Registration Form</h1>

  <form>
    <fieldset>
      <legend>Student Details</legend>

      <p>
        <label for="student-name">Full Name:</label>
        <input type="text" id="student-name" name="student-name">
      </p>

      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
      </p>

      <p>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
      </p>

      <p>
        <label for="birth-date">Date of Birth:</label>
        <input type="date" id="birth-date" name="birth-date">
      </p>

      <p>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
      </p>

      <p>
        <label for="photo">Upload a Photo:</label>
        <input type="file" id="photo" name="photo">
      </p>

      <p>
        <input type="checkbox" id="updates" name="updates">
        <label for="updates">I would like to receive class updates.</label>
      </p>

      <p>Preferred study mode:</p>
      <input type="radio" id="online" name="study-mode" value="online">
      <label for="online">Online</label>

      <input type="radio" id="classroom" name="study-mode" value="classroom">
      <label for="classroom">Classroom</label>
    </fieldset>
