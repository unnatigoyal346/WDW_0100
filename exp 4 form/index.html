<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking form</title>
</head>
<body>
    <center>

    <h1><u>Hotel room booking</u></h1>
    <form>
        <label for="name"> Full Name:</label> 
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" placeholder="Phone Number"><br><br>

        <label for="checkin">Check-in Date:</label>
        <input type="date" id="checkin" name="checkin"><br><br>

        <label for="roomType">Room Type:</label>
        <select id="roomType" name="roomType">
            <option value="single">Single</option>
            <option value="double">Double</option>
            <option value="suite">Suite</option>
        </select><br><br>

        <label for="guests">Number of Guests:</label>
        <input type="number" id="guests" name="guests" min="1" max="10"><br><br>
    
        <label for="specialRequests">Special Requests:</label><br>
        <textarea id="specialRequests" name="specialRequests" rows="4" cols="50" 
        placeholder="Any special requests or requirements"></textarea><br><br>

        <label for="checkout">Check-out Date:</label>
        <input type="date" id="checkout" name="checkout"><br><br>

        <input type="submit" value="Book Room">
        <input type="reset" value="Reset Form">
    </form>
    
    </center>

</body>
</html>
