<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 8 - Hyperlinks and Images</title>
</head>
<body>
  <h1>Useful Links</h1>

  <h2>Internal link</h2>
  <p><a href="#photo">Jump to the image</a></p>

  <h2>External link</h2>
  <p>
    <a href="https://www.w3.org/"
       target="_blank"
       rel="noopener noreferrer">
      Visit W3C
    </a>
  </p>

  <h2>Email link</h2>
  <p><a href="mailto:hello@example.com">Email us</a></p>

  <h2 id="photo">Image link</h2>
  <p>
    <a href="https://www.w3.org/" target="_blank" rel="noopener noreferrer">
      <img
        src="https://www.w3.org/assets/logos/w3c/w3c-no-bars.svg"
        alt="W3C website logo"
        width="160">
    </a>
  </p>
  </body>
</html>
