<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College timetable</title>
</head>
<body>
    <center>
    <table border="1" cellspacing="0" cellpadding="5">
        <caption><b>College Timetable</b></caption>
        <thead>
            <tr>
                <th>Day / Time</th>
                <th>9:00 - 10:00</th>
                <th>10:00 - 11:00</th>
                <th>11:00 - 12:00</th>
                <th>12:00 - 1:00</th>
                <th>1:00 - 2:00</th>
                <th>2:00 - 3:00</th>
                <th>3:00 - 4:00</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="2">Monday</td>
                <td rowspan="2">Mathematics</td>
                <td>English</td>
                <td>C Programming</td>
                <td rowspan="5">Break</td>
                <td colspan="2">Computer Lab</td>
                <td>Sports</td>
            </tr>
            <tr>
                <td>C Programming</td>
                <td rowspan="4">Physics</td>
                <td colspan="2">Electronics Lab</td>
                <td>Library</td>
            </tr>
            <!-- Additional rows can be added here -->
        </tbody>
    </table>
    </center>
</body>
</html>
